upstream eduqash_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;

    # Static fayllar (CSS, JS, Admin statika)
    location /static/ {
        alias /home/ubuntu/eduqash2/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media fayllar (Yuklangan rasmlar, PDF va fayllar)
    location /media/ {
        alias /home/ubuntu/eduqash2/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSockets (Real-time Chat /ws/ uchun)
    location /ws/ {
        proxy_pass http://eduqash_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API & Django HTTP so'rovlari
    location / {
        proxy_pass http://eduqash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
